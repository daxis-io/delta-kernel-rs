[package]
name = "datafusion_executor"
description = "DataFusion-based PlanExecutor for delta_kernel declarative plans."
edition = "2021"
homepage = "https://delta.io"
license = "Apache-2.0"
repository = "https://github.com/delta-io/delta-kernel-rs"
version = "0.26.0"
rust-version = "1.94.0"

[workspace]

[features]
# Shared deterministic source for native/browser qualification only.
qualification-fixture = []

[dependencies]
delta_kernel = { path = "../kernel", default-features = false, features = [
  "declarative-plans",
  "operation-tasks",
  "vendored-protoc",
  "arrow-only",
  "arrow-expression",
] }
datafusion = { version = "55", default-features = false, features = ["nested_expressions"] }
itertools = "0.14"
async-trait = "0.1"
dashmap = { version = "6.2.1", default-features = false }
futures = "0.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2"
object_store = { version = "0.14.1", default-features = false }
datafusion-datasource = { version = "55", default-features = false }
datafusion-datasource-json = { version = "55", default-features = false }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
datafusion = { version = "55", default-features = false, features = ["runtime-tokio", "json"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
datafusion = { version = "55", default-features = false, features = ["browser"] }
datafusion-datasource-json = { version = "55", default-features = false, features = ["runtime-browser"] }

[dev-dependencies]
rstest = "0.23"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Narrow Phase D qualification-only local dependency overlay.
[patch.crates-io]
